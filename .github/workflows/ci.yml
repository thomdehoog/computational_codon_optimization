name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  splice:
    name: Python 3.12 with MaxEntScan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Explicit/automatic human splice screening uses MaxEntScan when it is
      # installed; exercise that optional backend as well as dependency-free runs.
      - run: pip install -e ".[dev]" "git+https://github.com/kepbod/maxentpy.git"
      - name: Confirm MaxEntScan really is in use
        run: python -c "from codonopt.splice import maxent_available; assert maxent_available()"
      - run: pytest -q

  web:
    name: Interface (type-check, build, end-to-end)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -e .
      - run: npm ci
        working-directory: web
      - name: Type-check and verify the committed build is current
        run: npm run check
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: End-to-end tests against the Python server
        run: npm test
        working-directory: web
        env:
          CI: "true"
      # Traces and screenshots, so a failure here can be read rather than guessed at.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
